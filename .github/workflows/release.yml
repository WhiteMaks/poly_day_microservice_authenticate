name: Poly Day release microservice authenticate

on:
  push:
    branches: [ "release_**" ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: ${{vars.PROJECT_NAME}}
      MICROSERVICE_NAME: ${{vars.MICROSERVICE_NAME}}
      APP_NAME: ${{vars.PROJECT_NAME}}_${{vars.MICROSERVICE_NAME}}

    steps:
      - name: Preparing git branch
        uses: actions/checkout@v3
        with:
          submodules: 'recursive'

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Install dependencies
        run: make install-dependencies

      - name: Autogenerate
        run: make autogenerate

      - name: Up test environment
        run: make up-test-environment

      - name: Migrate database
        run: make migrate-db

      - name: Unit test
        run: make test

      - name: Build binary
        run: make build

      - name: Login into docker
        run: docker login -u ${{secrets.DOCKER_USERNAME}} -p ${{secrets.DOCKER_ACCESS_TOKEN}}

      - name: Build docker image
        run: docker build -t ${{secrets.DOCKER_USERNAME}}/poly_day_microservice_authenticate:${{github.ref_name}} .

      - name: Push docker tag
        run: docker push ${{secrets.DOCKER_USERNAME}}/poly_day_microservice_authenticate:${{github.ref_name}}

      - name: Go to database folder
        run: cd ./database

      - name: Build docker image for migrator
        run: docker build -t ${{secrets.DOCKER_USERNAME}}/poly_day_microservice_authenticate_migrator:${{github.ref_name}} ./database/ -f database/Dockerfile

      - name: Push docker tag for migrator
        run: docker push ${{secrets.DOCKER_USERNAME}}/poly_day_microservice_authenticate_migrator:${{github.ref_name}}
